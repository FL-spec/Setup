# Prose gate for human-facing documentation.
#
# Two rule sets, deliberately:
#   Google               - house style: voice, terminology, structure.
#   signs-of-ai-writing  - the tells that make prose read as machine-written.
#                          Built from Wikipedia's "Signs of AI Writing" (CC-BY-SA 4.0).
#
# Severity policy: the gate runs at --minAlertLevel=warning. The AI-writing rules put
# their most useful checks at warning and suggestion, so an error-only gate would never
# catch the thing this exists to catch.
#
# Run `vale sync` (or `make docs-sync`) once to download the packages.

StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = Google, https://github.com/ammil-industries/vale-signs-of-ai-writing/releases/latest/download/signs-of-ai-writing.zip

Vocab = Project

[*.md]
BasedOnStyles = Google, signs-of-ai-writing

# This repo title-cases headings in its navigation files on purpose.
Google.Headings = NO

# --- Documented exceptions -------------------------------------------------
# Two Google rules fight this repository's deliberate choices. Both are turned off
# on purpose, not because they were noisy.

# Google.We: "avoid first-person plural". This template's voice is first-person
# plural by design — HOW_WE_BUILD.md, "how we develop", "what we're building". The
# docs describe a shared method, and writing them in the passive to satisfy a linter
# would make them worse.
Google.We = NO

# Google.Colons: "lowercase after a colon". Fires on the file-template listings
# ("**prd/00-master-prd.md**: Vision & Goals / Actors / ..."), where the capitalised
# words are section names, not sentences.
Google.Colons = NO
