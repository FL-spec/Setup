# CI — the feedback loop the fl-* skills rely on. Keep it green.
#
# The jobs below MUST run exactly the commands in `quality_gates` in .sdlc/sdlc-config.yml.
# A CI that checks something different from what the reviewer subagent runs is how a branch
# goes green locally and red on GitHub.
#
# /fl-bootstrap keeps the preset job for your stack, substitutes the real module paths, and
# deletes the rest. Do the same by hand if you're setting this up yourself.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- The template's own contract. Always runs; never disable it. ---
  # Checks the workflow itself: canonical roles match both vendor adapters, every
  # skill is invocable, every Markdown link resolves, wiki links stay inside wiki/,
  # and .sdlc/sdlc-config.yml still matches its schema.
  template-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install -r requirements-dev.txt
      - run: make check

  # --- The prose gate. Google's style guide plus the signs-of-ai-writing rules. ---
  # See .sdlc/policies/writing-standards.md for what it enforces and why warnings fail.
  #
  # The --glob must stay in step with DOC_SOURCES in the Makefile: .claude, .agents, .codex
  # and .github are instructions written for machines, and Vale's readability rules pull
  # against how those files need to read. Linting them is not merely noisy — the YAML
  # frontmatter in a SKILL.md stops Vale with a parse error, so the job fails before it
  # reports anything. tests/test_workflow_contract.py locks the two lists together.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Vale
        uses: errata-ai/vale-action@reviewdog
        with:
          version: 3.17.1
          files: all
          fail_on_error: true
          reporter: github-pr-check
          vale_flags: "--minAlertLevel=warning --glob=!{.claude,.agents,.codex,.github}/**"

  # --- Preset: TypeScript / Node (pnpm) ---
  node:
    if: false # /fl-bootstrap flips this to `true` for the stack you use
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  # --- Preset: Python (uv + ruff + pytest) ---
  python:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check src
      - run: uv run ruff format --check src
      - run: uv run mypy src
      - run: uv run pytest

  # --- Preset: Rust (cargo) ---
  rust:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo build --release
