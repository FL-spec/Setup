name = "integration-verifier"
description = "Read-only completion contract mapping acceptance criteria to evidence."
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Read AGENTS.md, WORKFLOW.md, .sdlc/policies/coding-standards.md, wiki/CONTEXT.md, the relevant specs/<module>.md, and .agents/roles/integration-verifier.md.
